<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS DENIED</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green: #00ff41;
    --cyan: #00e5ff;
    --red: #ff003c;
    --dark: #050a05;
    --glow-green: 0 0 8px #00ff41, 0 0 20px #00ff4180, 0 0 40px #00ff4140;
    --glow-red: 0 0 8px #ff003c, 0 0 20px #ff003c80;
    --glow-cyan: 0 0 8px #00e5ff, 0 0 20px #00e5ff80;
  }

  body {
    background: var(--dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    overflow: hidden;
    position: relative;
  }

  /* Scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,255,65,0.03) 2px,
      rgba(0,255,65,0.03) 4px
    );
    pointer-events: none;
    z-index: 100;
    animation: scanlines 8s linear infinite;
  }

  /* Grid bg */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,65,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,65,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes scanlines {
    0% { background-position: 0 0; }
    100% { background-position: 0 100px; }
  }

  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }

  /* Glitch border box */
  .skull-wrapper {
    position: relative;
    padding: 24px 32px;
    border: 1px solid var(--green);
    box-shadow: var(--glow-green), inset 0 0 30px rgba(0,255,65,0.05);
    animation: borderPulse 3s ease-in-out infinite;
  }

  .skull-wrapper::before, .skull-wrapper::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: var(--cyan);
    border-style: solid;
  }
  .skull-wrapper::before { top: -2px; left: -2px; border-width: 2px 0 0 2px; }
  .skull-wrapper::after { bottom: -2px; right: -2px; border-width: 0 2px 2px 0; }

  @keyframes borderPulse {
    0%, 100% { box-shadow: var(--glow-green), inset 0 0 30px rgba(0,255,65,0.05); }
    50% { box-shadow: var(--glow-cyan), inset 0 0 30px rgba(0,229,255,0.07); }
  }

  .skull {
    font-size: clamp(80px, 15vw, 140px);
    line-height: 1;
    display: block;
    filter: drop-shadow(0 0 10px rgba(0,255,65,0.7)) drop-shadow(0 0 30px rgba(0,255,65,0.4));
    animation: skullFlicker 4s ease-in-out infinite, skullFloat 3s ease-in-out infinite;
  }

  @keyframes skullFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  @keyframes skullFlicker {
    0%, 96%, 100% { opacity: 1; filter: drop-shadow(0 0 10px rgba(0,255,65,0.7)) drop-shadow(0 0 30px rgba(0,255,65,0.4)); }
    97% { opacity: 0.4; filter: drop-shadow(0 0 2px rgba(255,0,60,0.9)); }
    98% { opacity: 1; filter: drop-shadow(0 0 20px rgba(0,229,255,0.9)); }
    99% { opacity: 0.6; }
  }

  .text-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .line1, .line2 {
    font-family: 'Orbitron', sans-serif;
    position: relative;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
  }

  .line1 {
    font-size: clamp(18px, 3.5vw, 36px);
    font-weight: 900;
    color: var(--red);
    text-shadow: var(--glow-red);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    border-right: 3px solid var(--red);
    animation:
      typewriterLine1 1.8s steps(28, end) 0.8s forwards,
      cursorBlink 0.7s step-end 0.8s infinite;
  }

  .line2 {
    font-size: clamp(13px, 2.5vw, 22px);
    font-weight: 900;
    color: var(--green);
    text-shadow: var(--glow-green);
    letter-spacing: 0.12em;
    border-right: 3px solid var(--green);
    opacity: 0;
    animation:
      fadeIn 0s 3.2s forwards,
      typewriterLine2 1s steps(14, end) 3.2s forwards,
      cursorBlinkGreen 0.7s step-end 3.2s 6,
      hideCursor 0s 6.4s forwards;
  }

  @keyframes typewriterLine1 {
    from { width: 0; }
    to { width: 100%; }
  }

  @keyframes typewriterLine2 {
    from { width: 0; }
    to { width: 100%; }
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }

  @keyframes cursorBlink {
    0%, 100% { border-color: var(--red); }
    50% { border-color: transparent; }
  }

  @keyframes cursorBlinkGreen {
    0%, 100% { border-color: var(--green); }
    50% { border-color: transparent; }
  }

  @keyframes hideCursor {
    to { border-color: transparent; }
  }

  /* Status bar */
  .status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: rgba(0,255,65,0.4);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    animation: statusFade 0.5s ease 5s forwards;
    opacity: 0;
    margin-top: 8px;
  }

  @keyframes statusFade {
    to { opacity: 1; }
  }

  .status span {
    animation: blink 1.2s step-end infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* Corner decorations */
  .corner {
    position: fixed;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: rgba(0,255,65,0.25);
    letter-spacing: 0.1em;
    z-index: 50;
  }
  .corner.tl { top: 16px; left: 20px; }
  .corner.tr { top: 16px; right: 20px; text-align: right; }
  .corner.bl { bottom: 16px; left: 20px; }
  .corner.br { bottom: 16px; right: 20px; text-align: right; }

  /* Glitch effect on load */
  @keyframes glitchIn {
    0% { transform: skewX(20deg) scaleY(0.8); opacity: 0; filter: hue-rotate(90deg); }
    30% { transform: skewX(-5deg) scaleY(1.05); opacity: 0.8; }
    60% { transform: skewX(2deg); opacity: 0.9; }
    100% { transform: skewX(0deg) scaleY(1); opacity: 1; filter: hue-rotate(0deg); }
  }

  .container {
    animation: glitchIn 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }
</style>
</head>
<body>

<div class="corner tl">SYS://BREACH_DETECTED<br>IP: 192.168.∞.0</div>
<div class="corner tr">USER: SANTI<br>LVL: ELITE</div>
<div class="corner bl">FIREWALL: DISABLED<br>ENCRYPTION: NULL</div>
<div class="corner br">▓▓▓▓▓▓▒░ 98%<br>ACCESS: GRANTED</div>

<div class="container">
  <div class="skull-wrapper">
    <span class="skull">💀</span>
  </div>

  <div class="text-block">
    <div class="line1">Santi has hacked your computer</div>
    <div class="line2">haha not really</div>
    <div class="status">// system integrity: <span>nominal</span> &nbsp;|&nbsp; threat level: <span>zero</span></div>
  </div>
</div>

</body>
</html>
